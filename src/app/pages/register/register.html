<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-icon"><i class="bi bi-person-plus"></i></div>

    <h1>Créer un compte</h1>
    <p class="subtitle">Commencez à gérer vos finances</p>

    <div class="auth-form">
      <div class="photo-inscription">
        <div class="photo-apercu">
          @if (photoChoisie) {
            <img [src]="photoChoisie" alt="Photo" />
          } @else {
            <i class="bi bi-person-circle"></i>
          }
        </div>
        <label class="btn-secondaire photo-btn">
          <i class="bi bi-camera"></i> Photo de profil (optionnel)
          <input type="file" accept="image/*" (change)="choisirPhoto($event)" hidden />
        </label>
      </div>
      <div class="row">
        <div class="field">
          <label><i class="bi bi-person"></i> Nom</label>
          <input type="text" placeholder="Ben Ali" #champNom />
        </div>
        <div class="field">
          <label><i class="bi bi-person"></i> Prénom</label>
          <input type="text" placeholder="Wiem" #champPrenom />
        </div>
      </div>

      <div class="field">
        <label><i class="bi bi-envelope"></i> Adresse email</label>
        <input type="email" placeholder="votre@email.com" #champEmail />
      </div>

      <div class="row">
        <div class="field">
          <label><i class="bi bi-lock"></i> Mot de passe</label>
          <input type="password" placeholder="••••••••" #champMdp />
        </div>
        <div class="field">
          <label><i class="bi bi-lock-fill"></i> Confirmer</label>
          <input type="password" placeholder="••••••••" #champConfirm />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label><i class="bi bi-cash-coin"></i> Revenu mensuel</label>
          <input type="number" placeholder="1200" #champRevenu />
        </div>
        <div class="field">
          <label><i class="bi bi-wallet2"></i> Solde initial</label>
          <input type="number" placeholder="500" #champSolde />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label><i class="bi bi-geo-alt"></i> Ville (gouvernorat)</label>
          <div class="ville-select">
            <button type="button" class="ville-bouton" (click)="basculerListeVilles()">
              <span [class.placeholder]="!villeChoisie">
                {{ villeChoisie || 'Choisir...' }}
              </span>
              <i class="bi bi-chevron-down"></i>
            </button>
            @if (listeVillesOuverte) {
              <div class="ville-liste">
                @for (v of villes; track v) {
                  <button
                    type="button"
                    class="ville-option"
                    [class.actif]="villeChoisie === v"
                    (click)="choisirVille(v)"
                  >
                    {{ v }}
                  </button>
                }
              </div>
            }
          </div>
        </div>
        <div class="field">
          <label><i class="bi bi-calendar-event"></i> Date de naissance</label>
          <input type="date" #champNaissance />
        </div>
      </div>

      <div class="field">
        <label><i class="bi bi-gender-ambiguous"></i> Genre</label>
        <div class="genre-choix">
          <button
            type="button"
            class="genre-btn"
            [class.actif]="genreChoisi === 'HOMME'"
            (click)="choisirGenre('HOMME')"
          >
            <i class="bi bi-gender-male"></i> Homme
          </button>
          <button
            type="button"
            class="genre-btn"
            [class.actif]="genreChoisi === 'FEMME'"
            (click)="choisirGenre('FEMME')"
          >
            <i class="bi bi-gender-female"></i> Femme
          </button>
        </div>
      </div>

      @if (erreur) {
        <div class="msg-erreur"><i class="bi bi-exclamation-circle"></i> {{ erreur }}</div>
      }

      <button
        type="button"
        class="btn-main"
        [disabled]="chargement"
        (click)="
          sInscrire(
            champNom.value,
            champPrenom.value,
            champEmail.value,
            champMdp.value,
            champConfirm.value,
            champRevenu.value,
            champSolde.value,
            champNaissance.value
          )
        "
      >
        @if (chargement) {
          <i class="bi bi-arrow-repeat"></i> Inscription...
        } @else {
          <i class="bi bi-check2-circle"></i> S'inscrire
        }
      </button>
    </div>

    <div class="divider"><span>ou</span></div>

    <p class="switch">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </div>
</div>
