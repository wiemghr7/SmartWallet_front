<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-icon"><i class="bi bi-person-plus"></i></div>

    <h1>Créer un compte</h1>
    <p class="subtitle">Commencez à gérer vos finances</p>

    <div class="auth-form">
      <div class="row">
        <div class="field">
          <label><i class="bi bi-person"></i> Nom</label>
          <input type="text" placeholder="Ben Ali" #champNom />
        </div>
        <div class="field">
          <label><i class="bi bi-person"></i> Prénom</label>
          <input type="text" placeholder="Wiem" #champPrenom />
        </div>
      </div>

      <div class="field">
        <label><i class="bi bi-envelope"></i> Adresse email</label>
        <input type="email" placeholder="votre@email.com" #champEmail />
      </div>

      <div class="row">
        <div class="field">
          <label><i class="bi bi-lock"></i> Mot de passe</label>
          <input type="password" placeholder="••••••••" #champMdp />
        </div>
        <div class="field">
          <label><i class="bi bi-lock-fill"></i> Confirmer</label>
          <input type="password" placeholder="••••••••" #champConfirm />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label><i class="bi bi-cash-coin"></i> Revenu mensuel</label>
          <input type="number" placeholder="1200" #champRevenu />
        </div>
        <div class="field">
          <label><i class="bi bi-wallet2"></i> Solde initial</label>
          <input type="number" placeholder="500" #champSolde />
        </div>
      </div>

      @if (erreur) {
        <div class="msg-erreur"><i class="bi bi-exclamation-circle"></i> {{ erreur }}</div>
      }

      <button
        type="button"
        class="btn-main"
        [disabled]="chargement"
        (click)="
          sInscrire(
            champNom.value,
            champPrenom.value,
            champEmail.value,
            champMdp.value,
            champConfirm.value,
            champRevenu.value,
            champSolde.value
          )
        "
      >
        @if (chargement) {
          <i class="bi bi-arrow-repeat"></i> Inscription...
        } @else {
          <i class="bi bi-check2-circle"></i> S'inscrire
        }
      </button>
    </div>

    <div class="divider"><span>ou</span></div>

    <p class="switch">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </div>
</div>
