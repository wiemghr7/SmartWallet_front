<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon"><i class="bi bi-wallet2"></i></div>

    <h1>Connexion</h1>
    <p class="subtitle">Bon retour parmi nous !</p>

    <div class="auth-form">
      <div class="field">
        <label><i class="bi bi-envelope"></i> Adresse email</label>
        <input type="email" placeholder="votre@email.com" #champEmail name="email" />
      </div>

      <div class="field">
        <label><i class="bi bi-lock"></i> Mot de passe</label>
        <input type="password" placeholder="••••••••" #champMdp name="motDePasse" />
      </div>

      @if (erreur) {
        <div class="msg-erreur"><i class="bi bi-exclamation-circle"></i> {{ erreur }}</div>
      }

      <button
        type="button"
        class="btn-main"
        [disabled]="chargement"
        (click)="seConnecter(champEmail.value, champMdp.value)"
      >
        @if (chargement) {
          <i class="bi bi-arrow-repeat"></i> Connexion...
        } @else {
          <i class="bi bi-box-arrow-in-right"></i> Se connecter
        }
      </button>
    </div>

    <div class="divider"><span>ou</span></div>

    <p class="switch">Pas encore de compte ? <a routerLink="/register">S'inscrire</a></p>
  </div>
</div>
