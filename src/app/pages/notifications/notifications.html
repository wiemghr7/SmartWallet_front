<div class="page-head">
  <div>
    <h1><i class="bi bi-bell"></i> Notifications</h1>
    <p>Vos alertes et rappels financiers</p>
  </div>
</div>

@if (chargement) {
  <div class="panel">
    <div class="panel-body empty">
      <i class="bi bi-hourglass-split"></i>
      <span>Chargement...</span>
    </div>
  </div>
} @else {
  <div class="notif-liste">
    @for (n of notifications; track $index) {
      <div class="notif-carte" [class]="'notif-' + n.type">
        <div class="notif-icone"><i class="bi {{ n.icone }}"></i></div>
        <div class="notif-contenu">
          <strong>{{ n.titre }}</strong>
          <span>{{ n.message }}</span>
        </div>
      </div>
    }
  </div>
}
