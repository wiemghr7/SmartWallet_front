<div class="app">
  <header class="navbar">
    <div class="nav-left">
      <span class="brand">
        <i class="bi bi-wallet2"></i>
        FinWise
      </span>

      <nav class="nav-links">
        <a routerLink="/dashboard" routerLinkActive="active">
          <i class="bi bi-grid-1x2"></i> Tableau de bord
        </a>
        <a routerLink="/transactions" routerLinkActive="active">
          <i class="bi bi-arrow-left-right"></i> Transactions
        </a>
        <a routerLink="/budgets" routerLinkActive="active">
          <i class="bi bi-pie-chart"></i> Budgets
        </a>

        <a routerLink="/goals" routerLinkActive="active">
          <i class="bi bi-bullseye"></i> Objectifs
        </a>
        <a routerLink="/prevision" routerLinkActive="active">
          <i class="bi bi-robot"></i> Prévision
        </a>
      </nav>
    </div>

    <div class="nav-right">
      <a routerLink="/notifications" class="icon-btn" title="Notifications">
        <i class="bi bi-bell"></i>
      </a>
      <a routerLink="/profile" class="user-chip">
        @if (photo) {
          <img [src]="photo" class="user-chip-photo" alt="Profil" />
        } @else {
          <i class="bi bi-person-circle"></i>
        }
        Profil
      </a>
      <a (click)="deconnecter()" class="btn-logout" style="cursor: pointer">
        <i class="bi bi-box-arrow-right"></i> Déconnexion
      </a>
    </div>
  </header>

  <main class="page-body">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <span><i class="bi bi-wallet2"></i> FinWise </span>
    <span>© 2026 FinWise — Gérez vos finances sereinement.</span>
  </footer>
</div>
